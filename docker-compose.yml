# Ejecuta toda la plataforma: docker compose up -d --build
# Con HTTPS automático en un servidor con dominio:  docker compose --profile https up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eco}
      POSTGRES_DB: ecoturismo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eco -d ecoturismo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://eco:${POSTGRES_PASSWORD:-eco}@db:5432/ecoturismo
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SEED_DEMO: ${SEED_DEMO:-false}
      COMISION_PORCENTAJE: ${COMISION_PORCENTAJE:-10}
      RESERVA_RETENCION_MIN: ${RESERVA_RETENCION_MIN:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Eco Turismo <no-reply@ecoturismo.local>}
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
